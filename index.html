<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线答题系统</title>
    <!-- 引入 LZ-String 用于压缩题库数据放入URL -->
    <script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }
        .navbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 16px 0;
            box-shadow: 0 2px 12px rgba(0,0,0,.15);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .container { max-width: 900px; margin: 0 auto; padding: 0 20px; }
        .navbar .container { display: flex; justify-content: space-between; align-items: center; }
        .navbar-brand { color: #fff; font-size: 1.3rem; font-weight: 600; text-decoration: none; }
        .navbar a {
            color: #fff; text-decoration: none; padding: 6px 14px;
            border-radius: 6px; font-size: .9rem; transition: background .2s;
        }
        .navbar a:hover { background: rgba(255,255,255,.2); }
        .page-wrap { padding: 30px 20px 60px; }
        .card {
            background: #fff; border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,.08);
            padding: 28px; margin-bottom: 20px;
        }
        .card-title { font-size: 1.15rem; font-weight: 600; margin-bottom: 18px; color: #333; }
        .upload-form { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
        input[type="text"], input[type="file"], input[type="password"] {
            padding: 10px 14px; border: 2px solid #e0e0e0; border-radius: 8px;
            font-size: .95rem; transition: border .2s; outline: none;
            flex: 1; min-width: 160px; width: 100%;
        }
        input:focus { border-color: #667eea; }
        .btn {
            padding: 10px 22px; border: none; border-radius: 8px;
            font-size: .95rem; font-weight: 500; cursor: pointer;
            transition: all .2s; text-decoration: none; display: inline-block; text-align: center;
        }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; }
        .btn-primary:hover { opacity: .9; transform: translateY(-1px); }
        .btn-success { background: #22c55e; color: #fff; }
        .btn-success:hover { background: #16a34a; }
        .btn-danger { background: #ef4444; color: #fff; }
        .btn-danger:hover { background: #dc2626; }
        .btn-outline { background: transparent; border: 2px solid #667eea; color: #667eea; }
        .btn-outline:hover { background: #667eea; color: #fff; }
        .btn-sm { padding: 5px 12px; font-size: .82rem; }
        .quiz-list-item {
            display: flex; align-items: center; gap: 20px;
            padding: 18px; border: 2px solid #f0f0f0;
            border-radius: 10px; margin-bottom: 12px; transition: all .2s;
        }
        .quiz-list-item:hover {
            border-color: #667eea;
            box-shadow: 0 4px 16px rgba(102,126,234,.12);
        }
        .qr-box { width: 90px; height: 90px; border-radius: 8px; border: 1px solid #eee; flex-shrink: 0; }
        .quiz-info { flex: 1; min-width: 0; }
        .quiz-info h4 { font-size: 1.05rem; color: #333; margin-bottom: 6px; }
        .quiz-meta { font-size: .82rem; color: #888; }
        .quiz-meta span { margin-right: 14px; }
        .alert { padding: 12px 18px; border-radius: 8px; margin-bottom: 16px; font-size: .9rem; }
        .alert-warning { background: #fef3c7; color: #92400e; border-left: 4px solid #f59e0b; }
        .alert-success { background: #d1fae5; color: #065f46; border-left: 4px solid #10b981; }
        .alert-danger { background: #fee2e2; color: #991b1b; border-left: 4px solid #ef4444; }
        .alert-info { background: #dbeafe; color: #1e40af; border-left: 4px solid #3b82f6; }
        .question-item { padding: 20px; border: 2px solid #f0f0f0; border-radius: 10px; margin-bottom: 16px; }
        .question-stem { font-size: 1rem; font-weight: 600; color: #333; margin-bottom: 14px; line-height: 1.6; }
        .badge {
            display: inline-block; padding: 2px 10px; border-radius: 20px;
            font-size: .72rem; font-weight: 500; margin-left: 8px; vertical-align: middle;
        }
        .badge-single { background: #dbeafe; color: #1e40af; }
        .badge-multiple { background: #fce7f3; color: #9d174d; }
        .badge-judge { background: #fef3c7; color: #92400e; }
        .badge-score { background: #e0e7ff; color: #3730a3; }
        .option-row {
            display: flex; align-items: center; padding: 10px 14px;
            border-radius: 8px; margin-bottom: 8px; cursor: pointer;
            transition: background .15s; border: 1px solid transparent;
        }
        .option-row:hover { background: #f8f9ff; border-color: #e0e7ff; }
        .option-row input { margin-right: 12px; width: 18px; height: 18px; accent-color: #667eea; cursor: pointer; }
        .option-row label { cursor: pointer; flex: 1; font-size: .95rem; color: #444; }
        .score-board {
            text-align: center; padding: 40px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px; color: #fff; margin-bottom: 24px;
        }
        .score-number { font-size: 4rem; font-weight: 700; line-height: 1; margin-bottom: 10px; }
        .score-number small { font-size: 1.6rem; font-weight: 400; opacity: .8; }
        .score-detail { font-size: 1rem; opacity: .92; margin-top: 14px; }
        .wrong-item {
            padding: 18px; background: #fff8f8; border-left: 4px solid #ef4444;
            border-radius: 8px; margin-bottom: 14px;
        }
        .wrong-stem { font-weight: 600; color: #333; margin-bottom: 12px; line-height: 1.6; }
        .answer-line { font-size: .9rem; margin-bottom: 6px; }
        .answer-line .label { color: #888; display: inline-block; min-width: 80px; }
        .answer-your { color: #ef4444; font-weight: 500; }
        .answer-correct { color: #22c55e; font-weight: 600; }
        .data-table { width: 100%; border-collapse: collapse; font-size: .9rem; }
        .data-table th {
            background: #f8f9ff; padding: 12px; text-align: left;
            font-weight: 600; color: #555; border-bottom: 2px solid #e0e7ff;
        }
        .data-table td { padding: 12px; border-bottom: 1px solid #f0f0f0; color: #444; }
        .data-table tr:hover td { background: #fafbff; }
        .empty-tip { text-align: center; padding: 40px; color: #aaa; font-size: .95rem; }
        .login-box { max-width: 380px; margin: 60px auto; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: .88rem; color: #555; margin-bottom: 6px; font-weight: 500; }
        .form-group input { width: 100%; }
        .user-info-group {
            display: flex; gap: 12px; flex-wrap: wrap;
            margin-bottom: 24px; padding-bottom: 20px; border-bottom: 2px dashed #e0e7ff;
        }
        .user-info-group > div { flex: 1; min-width: 180px; }
        .hint { font-size: .82rem; color: #999; margin-top: 10px; line-height: 1.6; }
        .hint a { color: #667eea; }
        .link-copy { font-size: .82rem; color: #667eea; word-break: break-all; cursor: pointer; }
        .link-copy:hover { text-decoration: underline; }
        /* 二维码弹窗 */
        .modal-mask {
            position: fixed; inset: 0; background: rgba(0,0,0,.55);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000; padding: 20px;
        }
        .modal-box {
            background: #fff; border-radius: 14px; padding: 30px;
            max-width: 480px; width: 100%; text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,.3);
        }
        .modal-box h3 { margin-bottom: 8px; color: #333; }
        .modal-box .qr-big { width: 240px; height: 240px; margin: 20px auto; display: block; border-radius: 10px; border: 1px solid #eee; }
        .share-url {
            font-size: .78rem; color: #667eea; background: #f8f9ff;
            padding: 12px; border-radius: 8px; word-break: break-all;
            margin-bottom: 14px; max-height: 100px; overflow-y: auto;
            text-align: left; line-height: 1.6;
        }
        .url-warn { font-size: .8rem; color: #d97706; background: #fef3c7; padding: 8px 12px; border-radius: 6px; margin-bottom: 14px; }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="container">
        <a href="/" class="navbar-brand">📝 在线答题系统</a>
        <div id="nav-actions"></div>
    </div>
</nav>

<div class="page-wrap">
    <div class="container" id="app"></div>
</div>

<div id="modal-root"></div>

<script>
// ============ 简易前端路由 & 渲染 ============
const app = document.getElementById('app');
const navActions = document.getElementById('nav-actions');
const modalRoot = document.getElementById('modal-root');

// 从 localStorage 读取数据（这样本机刷新后数据还在）
let mockData = { quizzes: [], submissions: {} };
try {
    const saved = localStorage.getItem('quiz_mockData');
    if (saved) mockData = JSON.parse(saved);
} catch (e) {}

function saveMockData() {
    try {
        localStorage.setItem('quiz_mockData', JSON.stringify(mockData));
    } catch (e) {
        console.warn('本地存储超限，可能题库太大，已跳过保存到 localStorage', e);
    }
}

// 判断是否登录
let isAdmin = sessionStorage.getItem('isAdmin') === '1';

// ---------- 导航渲染 ----------
function renderNav() {
    if (isAdmin) {
        navActions.innerHTML = `
            <a href="#/admin">后台管理</a>
            <a href="#" onclick="logout();return false;">退出</a>
        `;
    } else {
        navActions.innerHTML = `
            <a href="#/admin/login">后台登录</a>
        `;
    }
}

function logout() {
    isAdmin = false;
    sessionStorage.removeItem('isAdmin');
    renderNav();
    location.hash = '#/';
}

// ---------- 工具函数 ----------
function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[m]));
}

function nowStr() {
    const d = new Date();
    const p = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}

// 二维码生成
function qrImgUrl(text, size) {
    size = size || 180;
    return `https://api.qrserver.com/v1/create-qr-code/?size=${size}x${size}&data=${encodeURIComponent(text)}`;
}

function typeLabel(t) {
    return { single: '单选题', multiple: '多选题', judge: '判断题' }[t] || t;
}
function typeBadgeClass(t) {
    return { single: 'badge-single', multiple: 'badge-multiple', judge: 'badge-judge' }[t] || '';
}

// 将题库对象压缩为 URL 安全字符串
function encodeQuiz(quiz) {
    try {
        // 去掉不必要字段以减小体积
        const mini = {
            t: quiz.title,
            q: quiz.questions.map(q => ({
                s: q.stem,
                o: q.options,
                a: q.answer,
                c: q.score,
                y: q.type || 'single'
            }))
        };
        return LZString.compressToEncodedURIComponent(JSON.stringify(mini));
    } catch (e) {
        console.error('编码失败', e);
        return null;
    }
}

// 从 URL 字符串解码题库
function decodeQuiz(str) {
    try {
        const raw = LZString.decompressFromEncodedURIComponent(str);
        if (!raw) return null;
        const mini = JSON.parse(raw);
        return {
            title: mini.t,
            questions: mini.q.map(q => ({
                stem: q.s,
                options: q.o,
                answer: q.a,
                score: q.c,
                type: q.y || 'single'
            }))
        };
    } catch (e) {
        return null;
    }
}

// ============ 页面：首页 ============
function pageIndex() {
    const list = mockData.quizzes.map(q => {
        const compressed = encodeQuiz(q);
        const shareUrl = compressed ? (location.origin + location.pathname + '#/quiz/' + compressed) : '';
        const qrUrl = compressed ? qrImgUrl(shareUrl, 180) : '';
        return `
        <div class="quiz-list-item">
            ${qrUrl ? `<img class="qr-box" src="${qrUrl}" alt="二维码" onclick="showQR('${escapeHtml(q.title)}','${compressed}')" style="cursor:pointer">` : ''}
            <div class="quiz-info">
                <h4>${escapeHtml(q.title)}</h4>
                <div class="quiz-meta">
                    <span>📋 ${q.questions.length} 题</span>
                    <span>👥 ${(mockData.submissions[q.id] || []).length} 人作答（本机）</span>
                    <span>🕐 ${q.created_at}</span>
                </div>
                <div style="margin-top:8px;display:flex;gap:14px;flex-wrap:wrap">
                    <span class="link-copy" onclick="showQR('${escapeHtml(q.title)}','${compressed}')">📱 显示二维码</span>
                    <span class="link-copy" onclick="copyShareLink('${compressed}')">🔗 复制答题链接</span>
                </div>
            </div>
            <div style="display:flex;flex-direction:column;gap:8px;flex-shrink:0">
                <a class="btn btn-primary btn-sm" href="#/quiz/${compressed}">预览答题</a>
                <a class="btn btn-outline btn-sm" href="#/admin/quiz/${q.id}">查看本机成绩</a>
            </div>
        </div>`;
    }).join('');

    app.innerHTML = `
        <div class="card">
            <div class="card-title">📤 上传题库</div>
            <form id="upload-form" class="upload-form">
                <input type="text" id="quiz-title" placeholder="试卷名称（可留空）">
                <input type="file" id="quiz-file" accept=".json" required>
                <button type="submit" class="btn btn-primary">上传并生成二维码</button>
            </form>
            <div class="hint">
                💡 支持 JSON 格式题库文件，结构示例：
                <code>[{"type":"single","stem":"题干","options":["选项A","选项B"],"answer":"A","score":5}]</code><br>
                💡 也可以下载 <a href="#" onclick="downloadTemplate();return false;">题库模板</a>
            </div>
        </div>
        <div class="card">
            <div class="alert alert-info" style="margin-bottom:18px">
                <strong>🌐 部署说明：</strong>试卷数据会被压缩后直接写入二维码链接中，任何人都可以扫码答题（无需服务器）。
                答题记录保存在答题者自己浏览器中，本机后台可以查看/导出<strong>本机提交</strong>的成绩。
            </div>
            <div class="card-title">📚 试卷列表</div>
            ${list || '<div class="empty-tip">暂无试卷，请先上传题库</div>'}
        </div>
    `;

    document.getElementById('upload-form').onsubmit = handleUpload;
}

function copyShareLink(compressed) {
    const url = location.origin + location.pathname + '#/quiz/' + compressed;
    navigator.clipboard.writeText(url).then(() => alert('链接已复制：\n' + url))
        .catch(() => prompt('请手动复制链接：', url));
}

function showQR(title, compressed) {
    const url = location.origin + location.pathname + '#/quiz/' + compressed;
    const urlLen = url.length;
    const warn = urlLen > 2500 ? `<div class="url-warn">⚠️ 链接较长（${urlLen} 字符），二维码较密，建议用「复制链接」方式分享，或使用支持长链接的扫码工具。</div>` : '';
    modalRoot.innerHTML = `
        <div class="modal-mask" onclick="if(event.target===this)closeModal()">
            <div class="modal-box">
                <h3>${escapeHtml(title)}</h3>
                <div style="color:#888;font-size:.85rem;margin-bottom:6px">用手机扫码即可答题</div>
                ${warn}
                <img class="qr-big" src="${qrImgUrl(url, 400)}" alt="二维码">
                <div style="font-size:.82rem;color:#888;margin-bottom:6px">或复制以下链接分享：</div>
                <div class="share-url" onclick="this.select?this.select():null">${escapeHtml(url)}</div>
                <div style="display:flex;gap:10px;justify-content:center">
                    <button class="btn btn-primary btn-sm" onclick="copyShareLink('${compressed}')">复制链接</button>
                    <button class="btn btn-outline btn-sm" onclick="closeModal()">关闭</button>
                </div>
            </div>
        </div>
    `;
}

function closeModal() {
    modalRoot.innerHTML = '';
}

function downloadTemplate() {
    const tpl = [
        { type: 'single', stem: '中国的首都是？', options: ['北京', '上海', '广州', '深圳'], answer: 'A', score: 5 },
        { type: 'multiple', stem: '以下哪些是编程语言？', options: ['Python', 'HTML', 'Java', 'Photoshop'], answer: 'AC', score: 5 },
        { type: 'judge', stem: '标准大气压下水的沸点是 100℃。', options: ['正确', '错误'], answer: 'A', score: 5 }
    ];
    const blob = new Blob([JSON.stringify(tpl, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '题库模板.json';
    a.click();
}

function handleUpload(e) {
    e.preventDefault();
    const titleInput = document.getElementById('quiz-title');
    const fileInput = document.getElementById('quiz-file');
    const file = fileInput.files[0];
    if (!file) return alert('请选择题库文件');

    const reader = new FileReader();
    reader.onload = ev => {
        let questions;
        try {
            questions = JSON.parse(ev.target.result);
        } catch (err) {
            return alert('文件解析失败：不是合法的 JSON 格式');
        }
        if (!Array.isArray(questions) || questions.length === 0) {
            return alert('题库为空或格式不正确');
        }
        for (let i = 0; i < questions.length; i++) {
            const q = questions[i];
            if (!q.stem || !q.answer || !Array.isArray(q.options)) {
                return alert(`第 ${i + 1} 题格式不正确，请检查`);
            }
            q.score = Number(q.score) || 1;
            q.type = q.type || 'single';
        }
        const title = titleInput.value.trim() || file.name.replace(/\.[^.]+$/, '');
        const quiz = {
            id: Date.now(),
            title,
            questions,
            created_at: nowStr()
        };
        mockData.quizzes.unshift(quiz);
        saveMockData();

        // 立即弹出二维码
        const compressed = encodeQuiz(quiz);
        if (compressed) {
            showQR(title, compressed);
        } else {
            alert('上传成功，但题库压缩失败（可能过大）');
        }
        pageIndex();
        // 页面重渲染后重新打开二维码弹窗
        if (compressed) setTimeout(() => showQR(title, compressed), 50);
    };
    reader.readAsText(file, 'utf-8');
}

// ============ 页面：答题 ============
function pageQuiz(dataStr) {
    // 优先尝试从 URL 压缩数据解析
    let quiz = null;
    let quizKey = dataStr; // 用作保存成绩的标识

    if (dataStr && dataStr.length > 20) {
        const decoded = decodeQuiz(dataStr);
        if (decoded) {
            quiz = {
                id: 'shared_' + dataStr.slice(0, 16),
                title: decoded.title,
                questions: decoded.questions,
                created_at: ''
            };
        }
    }

    // 回退：从本机 mockData 找（用旧 code 字段兼容）
    if (!quiz) {
        quiz = mockData.quizzes.find(q => q.code === dataStr);
    }

    if (!quiz) {
        app.innerHTML = `
            <div class="card">
                <div class="alert alert-danger">试卷不存在或链接已失效</div>
                <div style="text-align:center;margin-top:20px">
                    <a class="btn btn-outline" href="#/">返回首页</a>
                </div>
            </div>`;
        return;
    }

    const qHtml = quiz.questions.map((q, idx) => {
        const letters = 'ABCDEFGHIJ'.slice(0, q.options.length);
        const opts = q.options.map((opt, i) => {
            const hasPrefix = /^[A-Za-z][.、\s]/.test(opt);
            const displayText = hasPrefix ? escapeHtml(opt) : `${letters[i]}. ${escapeHtml(opt)}`;
            return `
                <div class="option-row">
                    <input type="${q.type === 'multiple' ? 'checkbox' : 'radio'}"
                           name="q_${idx}" id="q${idx}_${i}" value="${letters[i]}">
                    <label for="q${idx}_${i}">${displayText}</label>
                </div>
            `;
        }).join('');

        return `
            <div class="question-item">
                <div class="question-stem">
                    ${idx + 1}. ${escapeHtml(q.stem)}
                    <span class="badge ${typeBadgeClass(q.type)}">${typeLabel(q.type)}</span>
                    <span class="badge badge-score">${q.score} 分</span>
                </div>
                ${opts}
            </div>
        `;
    }).join('');

    app.innerHTML = `
        <div class="card">
            <div class="card-title">${escapeHtml(quiz.title)}</div>
            <form id="quiz-form">
                <div class="user-info-group">
                    <div>
                        <label style="font-weight:600;">姓名 <span style="color:red">*</span></label>
                        <input type="text" id="user-name" placeholder="请输入真实姓名" required>
                    </div>
                    <div>
                        <label style="font-weight:600;">工号 <span style="color:red">*</span></label>
                        <input type="text" id="user-id" placeholder="请输入工号" required>
                    </div>
                    <div>
                        <label style="font-weight:600;">部门 <span style="color:red">*</span></label>
                        <input type="text" id="user-dept" placeholder="请输入所在部门" required>
                    </div>
                </div>
                ${qHtml}
                <button type="submit" class="btn btn-primary" style="width:100%;padding:14px;font-size:1rem">提交答卷</button>
            </form>
        </div>
    `;

    document.getElementById('quiz-form').onsubmit = ev => {
        ev.preventDefault();
        const name = document.getElementById('user-name').value.trim();
        const empId = document.getElementById('user-id').value.trim();
        const department = document.getElementById('user-dept').value.trim();

        if (!name || !empId || !department) {
            alert('请完整填写姓名、工号和部门信息后再提交！');
            return;
        }

        let got = 0, correctCount = 0;
        const wrongList = [];
        const details = [];

        quiz.questions.forEach((q, idx) => {
            const checked = [...document.querySelectorAll(`input[name="q_${idx}"]:checked`)].map(x => x.value);
            const userAns = checked.sort().join('');
            const isCorrect = userAns && userAns === q.answer;
            if (isCorrect) {
                got += Number(q.score);
                correctCount++;
            } else {
                wrongList.push({ q, userAns: userAns || '未作答' });
            }
            details.push({ idx, userAns, isCorrect: !!isCorrect });
        });

        const totalScore = quiz.questions.reduce((s, q) => s + Number(q.score), 0);

        // 保存记录（在答题者本机）
        if (!mockData.submissions[quiz.id]) mockData.submissions[quiz.id] = [];
        const record = {
            id: Date.now(),
            name, empId, department,
            score: got, total: totalScore,
            correctCount, totalCount: quiz.questions.length,
            created_at: nowStr(),
            details, wrongList
        };
        mockData.submissions[quiz.id].push(record);
        saveMockData();

        pageResult(quiz, record);
    };
}

// ============ 页面：结果 ============
function pageResult(quiz, record) {
    const pct = record.totalCount ? Math.round(record.correctCount / record.totalCount * 100) : 0;
    let comment = '继续加油 💪';
    if (pct >= 90) comment = '太棒了，学霸！🏆';
    else if (pct >= 75) comment = '不错，再接再厉！👍';
    else if (pct >= 60) comment = '及格啦，还有提升空间 📖';

    const wrongHtml = record.wrongList.map((item, i) => {
        const q = item.q;
        const letters = 'ABCDEFGHIJ'.slice(0, q.options.length);
        const correctText = q.answer.split('').map(ch => {
            const idx = letters.indexOf(ch);
            return idx >= 0 ? `${ch}. ${q.options[idx]}` : ch;
        }).join(' ｜ ');
        const yourText = item.userAns === '未作答' ? '未作答' : item.userAns.split('').map(ch => {
            const idx = letters.indexOf(ch);
            return idx >= 0 ? `${ch}. ${q.options[idx]}` : ch;
        }).join(' ｜ ');

        return `
            <div class="wrong-item">
                <div class="wrong-stem">${i + 1}. ${escapeHtml(q.stem)}</div>
                <div class="answer-line"><span class="label">你的答案：</span><span class="answer-your">${escapeHtml(yourText)}</span></div>
                <div class="answer-line"><span class="label">正确答案：</span><span class="answer-correct">${escapeHtml(correctText)}</span></div>
            </div>
        `;
    }).join('');

    app.innerHTML = `
        <div class="score-board">
            <div style="font-size:1rem;opacity:.9;margin-bottom:8px">
                ${escapeHtml(record.name)}（工号：${escapeHtml(record.empId)} | 部门：${escapeHtml(record.department)}）的答题结果
            </div>
            <div class="score-number">${record.score}<small> / ${record.total}</small></div>
            <div class="score-detail">
                答对 ${record.correctCount} / ${record.totalCount} 题　正确率 ${pct}%<br>
                <span style="font-size:1.1rem;margin-top:8px;display:inline-block">${comment}</span>
            </div>
        </div>
        ${record.wrongList.length ? `
            <div class="card">
                <div class="card-title">❌ 错题回顾（${record.wrongList.length} 题）</div>
                ${wrongHtml}
            </div>
        ` : `
            <div class="card"><div class="alert alert-success">🎉 全部答对，太厉害了！</div></div>
        `}
        <div style="text-align:center">
            <a class="btn btn-outline" href="#/">返回首页</a>
        </div>
    `;
}

// ============ 页面：后台登录 ============
function pageLogin() {
    app.innerHTML = `
        <div class="login-box card">
            <div class="card-title" style="text-align:center">🔐 后台登录</div>
            <form id="login-form">
                <div class="form-group">
                    <label>管理密码</label>
                    <input type="password" id="admin-pwd" placeholder="请输入管理密码" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%">登录</button>
            </form>
            <div class="hint" style="text-align:center">默认密码：admin123</div>
        </div>
    `;
    document.getElementById('login-form').onsubmit = e => {
        e.preventDefault();
        const pwd = document.getElementById('admin-pwd').value;
        if (pwd === 'admin123') {
            isAdmin = true;
            sessionStorage.setItem('isAdmin', '1');
            renderNav();
            location.hash = '#/admin';
        } else {
            alert('密码错误');
        }
    };
}

// ============ 页面：后台管理 ============
function pageAdmin() {
    if (!isAdmin) { location.hash = '#/admin/login'; return; }

    const rows = mockData.quizzes.map(q => `
        <tr>
            <td>${q.id}</td>
            <td>${escapeHtml(q.title)}</td>
            <td>${q.questions.length}</td>
            <td>${(mockData.submissions[q.id] || []).length}</td>
            <td>${q.created_at}</td>
            <td>
                <a class="btn btn-outline btn-sm" href="#/admin/quiz/${q.id}">成绩明细</a>
                <button class="btn btn-success btn-sm" onclick="exportScores(${q.id})">导出</button>
                <button class="btn btn-danger btn-sm" onclick="deleteQuiz(${q.id})">删除</button>
            </td>
        </tr>
    `).join('');

    app.innerHTML = `
        <div class="card">
            <div class="card-title">🛠 后台管理（本机记录）</div>
            <div class="alert alert-warning" style="margin-bottom:14px">
                ⚠️ 由于是纯静态部署，此处显示的是<strong>本机浏览器</strong>的答题记录。若需要跨设备统计所有人的成绩，请改用带后端的版本。
            </div>
            <table class="data-table">
                <thead>
                    <tr><th>ID</th><th>试卷名称</th><th>题目数</th><th>作答人数</th><th>创建时间</th><th>操作</th></tr>
                </thead>
                <tbody>${rows || '<tr><td colspan="6" class="empty-tip">暂无数据</td></tr>'}</tbody>
            </table>
        </div>
    `;
}

function deleteQuiz(id) {
    if (!confirm('确认删除该试卷及所有成绩？')) return;
    mockData.quizzes = mockData.quizzes.filter(q => q.id !== id);
    delete mockData.submissions[id];
    saveMockData();
    pageAdmin();
}

function exportScores(quizId) {
    const quiz = mockData.quizzes.find(q => q.id === quizId);
    if (!quiz) return;
    const subs = mockData.submissions[quizId] || [];
    if (!subs.length) return alert('暂无成绩可导出');

    const header = ['姓名', '工号', '部门', '得分', '总分', '正确题数', '总题数', '正确率', '提交时间'];
    const rows = subs.map(s => [
        s.name, s.empId || '', s.department || '',
        s.score, s.total, s.correctCount, s.totalCount,
        (s.totalCount ? Math.round(s.correctCount / s.totalCount * 100) : 0) + '%',
        s.created_at
    ]);
    const csv = '\ufeff' + [header, ...rows].map(r => r.map(v => `"${v}"`).join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${quiz.title}_成绩_${nowStr().replace(/[: ]/g, '')}.csv`;
    a.click();
}

// ============ 页面：单份试卷成绩明细 ============
function pageAdminQuiz(quizId) {
    if (!isAdmin) { location.hash = '#/admin/login'; return; }
    const quiz = mockData.quizzes.find(q => q.id === quizId);
    if (!quiz) { app.innerHTML = `<div class="card"><div class="empty-tip">试卷不存在</div></div>`; return; }
    const subs = mockData.submissions[quizId] || [];

    const rows = subs.map((s, i) => `
        <tr>
            <td>${i + 1}</td>
            <td>${escapeHtml(s.name)}</td>
            <td>${escapeHtml(s.empId || '-')}</td>
            <td>${escapeHtml(s.department || '-')}</td>
            <td><strong>${s.score}</strong> / ${s.total}</td>
            <td>${s.correctCount} / ${s.totalCount}</td>
            <td>${s.totalCount ? Math.round(s.correctCount / s.totalCount * 100) : 0}%</td>
            <td>${s.created_at}</td>
        </tr>
    `).join('');

    app.innerHTML = `
        <div class="card">
            <div class="card-title">📊 ${escapeHtml(quiz.title)} - 成绩明细</div>
            <div style="margin-bottom:16px">
                <button class="btn btn-success btn-sm" onclick="exportScores(${quiz.id})">导出 Excel</button>
                <a class="btn btn-outline btn-sm" href="#/admin">返回</a>
            </div>
            <table class="data-table">
                <thead>
                    <tr><th>#</th><th>姓名</th><th>工号</th><th>部门</th><th>得分</th><th>正确题数</th><th>正确率</th><th>提交时间</th></tr>
                </thead>
                <tbody>${rows || '<tr><td colspan="8" class="empty-tip">暂无作答记录</td></tr>'}</tbody>
            </table>
        </div>
    `;
}

// ============ 路由 ============
function router() {
    const hash = location.hash.slice(1) || '/';
    // 注意：quiz 后的数据可能很长，不能简单 split('/')
    if (hash.startsWith('/quiz/')) {
        pageQuiz(hash.slice('/quiz/'.length));
        window.scrollTo(0, 0);
        return;
    }
    const parts = hash.split('/').filter(Boolean);
    if (parts.length === 0) { pageIndex(); }
    else if (parts[0] === 'admin' && parts[1] === 'login') { pageLogin(); }
    else if (parts[0] === 'admin' && parts[1] === 'quiz' && parts[2]) { pageAdminQuiz(Number(parts[2])); }
    else if (parts[0] === 'admin') { pageAdmin(); }
    else { pageIndex(); }
    window.scrollTo(0, 0);
}

window.addEventListener('hashchange', router);
window.addEventListener('load', () => { renderNav(); router(); });
</script>
</body>
</html>
